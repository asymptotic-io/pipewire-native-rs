[package]
name = "pipewire-native-tools"
description = "PipeWire utilities built with the pipewire-native library"
version.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true

[[bin]]
name = "pw-browse"
path = "browse/main.rs"

[dependencies]
crossterm = "0.29.0"
pipewire-native.workspace = true
pipewire-native-spa.workspace = true
tui-realm-stdlib = { version = "3.0.0", features = ["crossterm"] }
tuirealm = { version = "3.0.1", features = ["derive", "crossterm"] }
