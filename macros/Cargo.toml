[package]
name = "pipewire-native-macros"
description = "Helper macros for the pipewire-native crate"
version.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true

[dependencies]
syn = { version = "*", features = ["extra-traits", "full"] }
quote = "*"
proc-macro2 = "*"

[dev-dependencies]
pipewire-native-spa = { path = "../spa" }

[lib]
proc-macro = true
