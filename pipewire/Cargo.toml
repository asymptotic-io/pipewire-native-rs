[package]
name = "pipewire-native"
version = "0.1.0"
edition = "2021"

[dependencies]
bitflags = "2.8.0"
libc = "0.2.172"
parking_lot = { version = "0.12.4", features = ["arc_lock"] }
paste = "1.0.15"
pipewire-native-macros = { path = "../macros" }
pipewire-native-spa = { path = "../spa" }
tinyjson = "2.5.1"

[dev-dependencies]
serial_test = "3"
tempfile = "3"

[lints.clippy]
# API users are responsible for their own synchronisation between main loop and
# other threads (a common pattern might be separate threads, but mutual
# exclusion via the thread lock). This means we legitimately have cases with
# non-Sync items in an Arc.
arc_with_non_send_sync = "allow"
